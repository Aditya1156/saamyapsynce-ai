    <text x="186" y="143" font-family="Courier New, monospace" font-size="13"
          letter-spacing="6" fill="#FFFFFF" fill-opacity="0.5">ARTIFICIAL INTELLIGENCE</text>

    <text x="80" y="322" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="bold" fill="#FFFFFF">Where intelligence</text>
    <text x="80" y="408" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="bold" fill="url(#sheen)">meets immersion.</text>

    <text x="80" y="474" font-family="Courier New, monospace" font-size="20" letter-spacing="2.2"
          fill="#FFFFFF" fill-opacity="0.55">APPLIED AI / COMPUTER VISION / AR / VR / XR</text>

    <!-- Discipline chips -->
    <g font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">
      <rect x="80"  y="518" width="84" height="46" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <text x="122" y="548" text-anchor="middle">AI</text>
      <rect x="176" y="518" width="84" height="46" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <text x="218" y="548" text-anchor="middle">AR</text>
      <rect x="272" y="518" width="84" height="46" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <text x="314" y="548" text-anchor="middle">VR</text>
      <rect x="368" y="518" width="84" height="46" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <text x="410" y="548" text-anchor="middle">XR</text>
    </g>

    <text x="1120" y="548" text-anchor="end" font-family="Courier New, monospace" font-size="17"
          fill="#FFFFFF" fill-opacity="0.45">saamyapsynce.com</text>

    <!-- Node cluster -->
    <g>
      <g stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="1.1">
        <line x1="880" y1="196" x2="1010" y2="146"/>
        <line x1="1010" y1="146" x2="1090" y2="262"/>
        <line x1="880" y1="196" x2="950" y2="296"/>
        <line x1="950" y1="296" x2="1090" y2="262"/>
        <line x1="1010" y1="146" x2="1065" y2="92"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="880" cy="196" r="4" fill-opacity="0.85"/>
        <circle cx="1010" cy="146" r="3" fill-opacity="0.6"/>
        <circle cx="1090" cy="262" r="4" fill-opacity="0.75"/>
        <circle cx="950" cy="296" r="3" fill-opacity="0.55"/>
        <circle cx="1065" cy="92" r="3" fill-opacity="0.5"/>
      </g>
